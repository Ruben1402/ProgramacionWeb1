<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamiento CSS</title>
    <meta name="author" content="Vazquez Rivera Ruben">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header id="encabezado">
        <section class="logo">
            <img src="imagenes/zo.jpg" alt="Bosque de la Ballena en Zou">
        </section>
        <h1>Posicionamiento en CSS</h1>
        <nav id="navegacion">
            <ul>
                <li><a href="#img1">Link 1</a></li>
                <li><a href="#img2">Link 2</a></li>
                <li><a href="#img4">Link 3</a></li>
            </ul>
        </nav>
    </header>
    <main id="elementos-posicionados">
        <section class="img1" id="img1">
            <img src="imagenes/wano.jpg" alt="Río de flores de cerezo en Wano">
        </section>
        <section class="img2" id="img2">
            <img src="imagenes/water7.jpg" alt="Canales y edificios de Water 7">
        </section>
        <section class="img3" id="img3">
            <img src="imagenes/going-merry.png" alt="El barco Going Merry navegando en el mar">
        </section>
        <section class="img4" id="img4">
            <img src="imagenes/ohara.jpg" alt="Árbol y paisaje de Ohara">
        </section>
    </main>
</body>
</html>
